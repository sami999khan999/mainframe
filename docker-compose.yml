name: mainframe

services:
  immich-server:
    container_name: mainframe_immich_server
    image: ghcr.io/immich-app/immich-server:release
    volumes:
      # Main read/write storage on your D: drive
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - "3004:2283"
    depends_on:
      - redis
      - postgres
    restart: always
    networks:
      - mainframe_network

  immich-machine-learning:
    container_name: mainframe_immich_ml
    image: ghcr.io/immich-app/immich-machine-learning:release
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    networks:
      - mainframe_network

  cloudflared:
    container_name: mainframe_cloudflared
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://immich-server:2283
    depends_on:
      - immich-server
    restart: always
    networks:
      - mainframe_network

  redis:
    container_name: mainframe_redis
    image: valkey/valkey:8-alpine
    restart: always
    networks:
      - mainframe_network

  postgres:
    container_name: mainframe_postgres
    image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvector0.8.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    networks:
      - mainframe_network

volumes:
  pgdata:
  model-cache:

networks:
  mainframe_network:
    name: mainframe_network
    driver: bridge
